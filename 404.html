<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Copix has moved</title>
  <link rel="canonical" href="https://copixdev.github.io/" />
  <!-- Fallback when JavaScript does not run. The script rewrites this to the full path, query, and hash. -->
  <meta id="refresh" http-equiv="refresh" content="1; url=https://copixdev.github.io/" />
  <script>
    function copixRedirectTarget(loc) {
      var prefix = "/copix";
      var path = (loc && loc.pathname) || "/";
      if (path === prefix || path.indexOf(prefix + "/") === 0) {
        path = path.slice(prefix.length) || "/";
      }
      if (!path || path.charAt(0) !== "/") path = "/" + (path || "");
      return "https://copixdev.github.io" + path + ((loc && loc.search) || "") + ((loc && loc.hash) || "");
    }
    var target = copixRedirectTarget(window.location);
    var meta = document.getElementById("refresh");
    if (meta) meta.setAttribute("content", "0; url=" + target);
    var link = document.getElementById("continue");
    if (link) link.setAttribute("href", target);
    var canonical = document.querySelector('link[rel="canonical"]');
    if (canonical) canonical.setAttribute("href", target);
    window.location.replace(target);
  </script>
</head>
<body>
  <p>Copix has moved to <a id="continue" href="https://copixdev.github.io/">https://copixdev.github.io/</a>.</p>
</body>
</html>
